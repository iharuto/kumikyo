<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kumikyo 組响 — 音のパターン認識トレーナー</title>
  <link rel="stylesheet" href="web/style.css" />
</head>
<body>
  <header>
    <h1>🎵 Kumikyo <span class="kanji">組响</span></h1>
    <p class="tagline">源氏香に着想を得た、音のパターン認識トレーニング</p>
  </header>

  <main id="app">
    <!-- ホーム画面 -->
    <section id="screen-home" class="screen active">
      <h2>設定</h2>

      <div class="field">
        <label>モード</label>
        <div class="btn-row" id="mode-buttons">
          <button class="chip active" data-mode="genjiko">源氏香 (5つの組を当てる)</button>
          <button class="chip" data-mode="taketori" disabled title="フェーズ2で実装予定">竹取 (準備中)</button>
        </div>
      </div>

      <div class="field">
        <label>難易度</label>
        <div class="btn-row" id="difficulty-buttons">
          <button class="chip" data-difficulty="easy">やさしい (3音)</button>
          <button class="chip active" data-difficulty="normal">ふつう (4音)</button>
          <button class="chip" data-difficulty="hard">むずかしい (5音)</button>
          <button class="chip" data-difficulty="very_hard">激ムズ (テキスト)</button>
        </div>
      </div>

      <p class="hint" id="difficulty-hint"></p>

      <button id="btn-start" class="primary big">セッション開始</button>

      <div class="field" style="margin-top:2rem">
        <button id="btn-show-stats" class="ghost">最近の成績を見る</button>
      </div>
    </section>

    <!-- プレイ画面 -->
    <section id="screen-play" class="screen">
      <div class="play-top">
        <button id="btn-play-seq" class="primary big">▶ 5つのメロディを再生</button>
        <p class="hint" id="play-status"></p>
      </div>

      <p class="hint">同じ組（同じメロディ）の並びを聞き取り、対応する源氏香の図を選んでください。</p>

      <div id="pattern-grid" class="grid"></div>

      <div class="play-bottom">
        <button id="btn-submit" class="primary big" disabled>回答する</button>
        <button id="btn-quit" class="ghost">やめる</button>
      </div>
    </section>

    <!-- 答え合わせ画面 -->
    <section id="screen-result" class="screen">
      <div id="result-banner" class="banner"></div>

      <div class="result-cols">
        <div class="result-answer">
          <h3>正解</h3>
          <div id="result-correct" class="answer-card"></div>
        </div>
        <div class="result-answer" id="result-yours-wrap">
          <h3>あなたの回答</h3>
          <div id="result-yours" class="answer-card"></div>
        </div>
      </div>

      <div class="replay-box">
        <h3>🔁 生成された音を聴き直す</h3>
        <p class="hint">位置1〜5のメロディ。同じ組は同じメロディです。</p>
        <div id="replay-positions" class="replay-positions"></div>
        <div class="btn-row" style="margin-top:.8rem">
          <button id="btn-replay-all" class="primary">▶ 全体を再生</button>
          <button id="btn-download-wav" class="ghost">WAVをダウンロード</button>
        </div>
      </div>

      <div class="btn-row" style="justify-content:center;margin-top:1.5rem">
        <button id="btn-next" class="primary big">次のセッション</button>
        <button id="btn-home" class="ghost">設定に戻る</button>
      </div>
    </section>
  </main>

  <!-- 成績ダイアログ -->
  <dialog id="stats-dialog">
    <h3>最近の成績</h3>
    <div id="stats-body"></div>
    <div class="btn-row" style="justify-content:flex-end;margin-top:1rem">
      <button id="btn-clear-stats" class="ghost danger">履歴を消去</button>
      <button id="btn-close-stats" class="primary">閉じる</button>
    </div>
  </dialog>

  <footer>
    <p>純正弦波による聴覚パターン識別。源氏香パターン: <span id="pattern-count">…</span> 種</p>
  </footer>

  <script src="web/app.js"></script>
</body>
</html>
